<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="52" viewBox="0 0 1200 52" role="img" aria-labelledby="title"><title id="title">Animated signal connecting code, learning and delivery</title><style>text{font-family:Segoe UI,Arial,sans-serif}.signal{animation:send 8s linear infinite}.ring{transform-origin:600px 26px;animation:ring 4s ease-in-out infinite}@keyframes send{to{stroke-dashoffset:-1200}}@keyframes ring{50%{transform:scale(1.35);opacity:.35}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style><defs><linearGradient id="g"><stop stop-color="#75ead0"/><stop offset=".5" stop-color="#73bfff"/><stop offset="1" stop-color="#c4a1ff"/></linearGradient></defs><path d="M0 26H1200" stroke="#34445a" stroke-opacity=".5"/><path class="signal" d="M0 26H1200" stroke="url(#g)" stroke-width="2" stroke-dasharray="100 1100"/><circle cx="600" cy="26" r="5" fill="#75ead0"/><circle class="ring" cx="600" cy="26" r="12" fill="none" stroke="#75ead0" stroke-opacity=".5"/></svg>