name: Contribution snake

on:
  schedule:
    - cron: "17 1 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/contribution-snake.yml"

permissions:
  contents: read

concurrency:
  group: contribution-snake
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Generate light and dark contribution snakes
        uses: Platane/snk/svg-only@d8f6715049803e982ee5ff501b6b9b7d5deeb09b # v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=#0f766e
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#5eead4

      - name: Respect reduced motion
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          for (const name of ['github-snake.svg', 'github-snake-dark.svg']) {
            const path = 'dist/' + name;
            const svg = fs.readFileSync(path, 'utf8');
            if (!svg.includes('<svg') || !svg.includes('@keyframes')) {
              throw new Error('Expected an animated SVG: ' + path);
            }
            const style = '<style>@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }</style>';
            fs.writeFileSync(path, svg.replace('</svg>', style + '</svg>'));
          }
          NODE

      - name: Publish generated SVGs
        uses: crazy-max/ghaction-github-pages@df5cc2bfa78282ded844b354faee141f06b41865 # v4.2.0
        with:
          target_branch: output
          build_dir: dist
          commit_message: "Refresh contribution snake"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
